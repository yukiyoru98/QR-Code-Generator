name: Deploy Worker and Pages

on:
  push:
    branches:
      - main

jobs:
  deploy-worker:
    name: Publish Worker
    runs-on: ubuntu-latest
    outputs:
      worker_url: ${{ steps.extract_url.outputs.worker_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install worker deps
        working-directory: ./worker
        run: npm ci

      - name: Publish Worker (wrangler)
        id: wrangler_publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          args: publish

      - name: Extract Worker URL via Cloudflare API
        id: extract_url
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKER_NAME: ${{ secrets.CLOUDFLARE_WORKER_NAME }}
        run: |
          set -e
          echo "Fetching deployments for service: $CLOUDFLARE_WORKER_NAME"
          API_URL="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/services/$CLOUDFLARE_WORKER_NAME/deployments"
          DEPLOY_JSON=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API_URL")
          echo "Raw response: $(echo "$DEPLOY_JSON" | sed -n '1,200p')"
          WORKER_URL=$(echo "$DEPLOY_JSON" | node -e "const fs=require('fs');const s=fs.readFileSync(0,'utf8');const j=JSON.parse(s);function find(o){if(!o) return ''; if(typeof o==='string'){ if(o.startsWith('http')) return o; return ''; } if(Array.isArray(o)){ for(const v of o){ const r=find(v); if(r) return r; } } if(typeof o==='object'){ for(const k of Object.keys(o)){ const r=find(o[k]); if(r) return r; } } return ''; } console.log(find(j) || '')")
          if [ -z "$WORKER_URL" ]; then
            echo "No worker URL found from deployments JSON. You may be using a route-based Worker (not a Service)."
            echo "worker_url=" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "Found worker URL: $WORKER_URL"
          echo "worker_url=$WORKER_URL" >> $GITHUB_OUTPUT

  deploy-pages:
    name: Deploy Pages (dashboard)
    needs: deploy-worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build (dashboard)
        working-directory: ./dashboard
        env:
          NEXT_PUBLIC_API_URL: ${{ needs.deploy-worker.outputs.worker_url }}
        run: |
          npm ci
          npm run build

      - name: Publish to Cloudflare Pages (action)
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}
          directory: ./dashboard/out
